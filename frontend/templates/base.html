{%- from "macros.html" import icon with context -%}
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/IBMPlexSans-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', path='fonts/IBMPlexMono-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/tabs.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/">{{ icon("switchboard") }}<span>{{ app_name }}</span></a>
    {% block topbar_actions %}{% endblock %}
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
