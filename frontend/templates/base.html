{#- Page shell: head, fonts, scripts. layout_app.html (the app with its sidebar)
    and home.html (the public home page) extend this. -#}
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/IBMPlexSans-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', path='fonts/IBMPlexMono-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', path='fonts/InstrumentSerif-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/tabs.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/upload.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
