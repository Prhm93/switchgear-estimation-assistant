{%- extends "base.html" -%}

{%- block title %}New project · {{ app_name }}{% endblock -%}

{%- block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">New project</p>
    <h1>Start an enquiry</h1>
    <p class="lede">Name the enquiry; you upload its documents on the next screen.</p>
  </div>
</div>
<form class="panel form narrow" method="post" action="/projects">
  {%- if error %}<p class="alert alert--error" role="alert">{{ error }}</p>{% endif %}
  <label class="field">
    <span class="field__label">Project name</span>
    <input class="input" name="name" value="{{ name }}" required maxlength="200" autocomplete="off">
  </label>
  <label class="field">
    <span class="field__label">Enquiry reference <span class="muted">(optional)</span></span>
    <input class="input mono" name="reference" value="{{ reference }}" maxlength="100" autocomplete="off">
  </label>
  <div class="row">
    <button class="btn btn--primary" type="submit">Create project</button>
    <a class="btn btn--ghost" href="/">Cancel</a>
  </div>
</form>
{% endblock -%}
