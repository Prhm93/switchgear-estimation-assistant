{%- extends "base.html" -%}

{%- block title %}{{ status }} · {{ app_name }}{% endblock -%}

{%- block content %}
<div class="page-header">
  <div>
    <p class="eyebrow">Error {{ status }}</p>
    <h1>{{ "Page not found" if status == 404 else "Not available" if status == 503 else "Request not completed" }}</h1>
    <p class="lede">{{ detail }}</p>
  </div>
</div>
<div class="row">
  <a class="btn btn--secondary" href="/">Projects</a>
  <a class="btn btn--ghost" href="/system">System check</a>
</div>
{% endblock -%}
