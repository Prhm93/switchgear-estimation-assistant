name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # PostgreSQL with pgvector, the same image as docker compose, so tests marked "database" run here.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sea
          POSTGRES_PASSWORD: sea-ci-only
          POSTGRES_DB: sea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sea -d sea"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+pg8000://sea:sea-ci-only@127.0.0.1:5432/sea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-data.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Rebuilds the showcase on this runner and records pixel differences from the committed
      # build (made on the developer laptop). Informational: it never fails the job.
      - name: Showcase rebuild diagnostics
        continue-on-error: true
        run: python -m data_generator diagnose-showcase | tee showcase-diagnostics.json

      - name: Upload showcase diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-diagnostics
          path: showcase-diagnostics.json

      # DATABASE_URL points at the service above; the accuracy tests run a two-project subset only.
      - name: Run tests
        run: python -m pytest -ra
